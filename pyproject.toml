[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfe-ccp-starter"
version = "0.2.0"
description = "Research starter for corrected transformer-encoder MPC with CCP and PIQP-compatible SQP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
optimization = [
  "cvxpy>=1.6",
  "clarabel>=0.10",
  "piqp>=0.6",
]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
